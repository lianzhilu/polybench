name: wasm reactor

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Test all benchmark adapters natively
        run: ./wasm/test-native.sh

      - name: Build floating-point and integer reactors
        run: |
          build_log=$(mktemp)
          if ! ./wasm/build.sh 2mm MINI >"$build_log" 2>&1; then
            cat "$build_log"
            while IFS= read -r line; do echo "::error::$line"; done < "$build_log"
            exit 1
          fi
          if ! ./wasm/build.sh nussinov MINI >"$build_log" 2>&1; then
            cat "$build_log"
            while IFS= read -r line; do echo "::error::$line"; done < "$build_log"
            exit 1
          fi
          cat "$build_log"

      - name: Require import-free modules
        run: |
          for module in build/wasm/*.wasm; do
            echo "checking $module"
            imports=$(wasm-dis "$module" -o - | grep '(import ' || true)
            if [[ -n "$imports" ]]; then
              echo "unexpected import in $module" >&2
              echo "$imports" >&2
              encoded_imports=$(printf '%s' "$imports" | base64 | tr -d '\n')
              echo "::error::unexpected-imports-base64=$encoded_imports"
              {
                echo "## Unexpected imports in $module"
                echo '```wat'
                echo "$imports"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              while IFS= read -r line; do
                echo "::error::$module: $line"
              done <<< "$imports"
              exit 1
            fi
            wasm-dis "$module" -o - | grep -q '(export "benchmark_run"'
            wasm-dis "$module" -o - | grep -q '(export "benchmark_checksum"'
          done

      - name: Preserve artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polybench-reactors
          path: build/wasm/*.wasm
